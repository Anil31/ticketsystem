<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Ticketsystem{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand" href="/">Ticketsystem</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Neues Ticket</a>
      <a class="nav-link" href="/intern/">Dashboard</a>
      <a class="nav-link" href="/intern/tickets/">Interne Liste</a>      

    </div>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }} mb-3">{{ m }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Danke</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light fuchs-bg">
<div class="container py-5">
  <div class="card p-4 shadow-lg glass-card">
  <style>
    :root {
      --bs-primary: #0093d0;
      --bs-primary-rgb: 0,147,208;
    }
  </style>

    <h1>Vielen Dank!</h1>
    <p>Dein Ticket wurde erstellt.</p>

    {% if ticket_id %}
      <p><strong>Ticket-ID:</strong> #{{ ticket_id }}</p>
    {% endif %}

    <!-- NEU: Zwei Buttons untereinander (mobil) oder nebeneinander (desktop) -->
    <div class="d-flex flex-column flex-md-row gap-2 mt-4">

      <a href="/" class="btn btn-primary w-100">
        Weiteres Ticket erstellen
      </a>

      {% if request.user.is_authenticated %}
      <a href="{% url 'tickets:my_tickets' %}" class="btn btn-outline-secondary w-100">
        Meine Tickets ansehen
      </a>
      {% endif %}

    </div>

  </div>
</div>
</body>
</html>
